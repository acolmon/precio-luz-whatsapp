name: Precio de la luz diario

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Enviar ahora aunque no sean las 08:00 en Espana"
        type: boolean
        default: true

concurrency:
  group: precio-luz
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Construir y enviar
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          FORZAR: ${{ (github.event_name == 'workflow_dispatch' && inputs.forzar) && '1' || '' }}
        run: python src/main.py
